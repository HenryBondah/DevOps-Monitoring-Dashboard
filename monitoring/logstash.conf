input {
  beats {
    port => 5044
  }
}

filter {
  # Parse timestamp and extract log fields
  grok {
    match => { 
      "message" => [
        "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}",
        "%{SYSLOGTIMESTAMP:timestamp} %{DATA:host} %{DATA:process}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:message_content}"
      ]
    }
  }
  
  # Add custom fields
  mutate {
    add_field => { "environment" => "development" }
    add_field => { "pipeline" => "filebeat-logstash-elasticsearch" }
  }
  
  # Convert log level to lowercase for consistency
  if [log_level] {
    mutate {
      lowercase => [ "log_level" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "system-logs-%{+YYYY.MM.dd}"
    manage_template => true
  }
  
  # Debug output to console
  stdout { 
    codec => rubydebug 
  }
}
