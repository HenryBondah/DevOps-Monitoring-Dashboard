apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-alerts
    receivers:
      - uid: email-critical
        type: email
        settings:
          addresses: admin@example.com
        disableResolveMessage: false

  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-warnings
        type: slack
        settings:
          url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
          recipient: '#monitoring'
          username: Grafana Alert
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: email-alerts
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: email-alerts
        matchers:
          - severity = critical
        continue: false

      - receiver: slack-alerts
        matchers:
          - severity = warning
        continue: false
